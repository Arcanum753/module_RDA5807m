#------------------------- esp32 + RDA5807M -------------------------
[env:esp32-rda5807m]
extends = env:esp32
src_filter = ${platformio.src_filter} +<module_RDA5807m/>
build_flags=
	${env.build_flags}
	${env:esp32.build_flags}
	-D DEBUG_RDA5807M=1
lib_deps =
	${env.lib_deps}
	${env:esp32.lib_deps}

#------------------------- esp8266 + RDA5807M -------------------------
[env:esp8266-rda5807m]
extends = env:esp8266
src_filter = ${platformio.src_filter} +<module_RDA5807m/>
build_flags=
	${env.build_flags}
	${env:esp8266.build_flags}
	-D DEBUG_RDA5807M=1
lib_deps =
	${env.lib_deps}
	${env:esp8266.lib_deps}

#------------------------- registry (автогенерация modules_registry) -------------------------
[registry]
object = module_rda5807m
define = MODULE_RDA5807M
namespace = rda5807m
web = 1
loop = 1
res = 1
time_source = 1
